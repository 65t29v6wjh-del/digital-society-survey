<script>
const SUPABASE_URL = 'https://bepruljjnztxpeufxigy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JyPnq-0TjfVPXX-tfW1Gbw_z4OLNbxW';

const RESPONDENT_KEY = 'digitalSocietyRespondentId';
const SUBMITTED_KEY = 'digitalSocietySubmitted';

function getRespondentId() {
    let id = localStorage.getItem(RESPONDENT_KEY);

    if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(RESPONDENT_KEY, id);
    }

    return id;
}

document.getElementById('submit').addEventListener('click', async () => {

    if (!state.today || !state.future) {
        return;
    }

    if (localStorage.getItem(SUBMITTED_KEY) === 'true') {
        alert('You have already submitted a response.');
        return;
    }

    const button = document.getElementById('submit');

    button.disabled = true;
    button.textContent = 'Submitting...';

    const responseData = {
        respondent_id: getRespondentId(),

        today_a: state.today[0],
        today_b: state.today[1],
        today_c: state.today[2],

        future_a: state.future[0],
        future_b: state.future[1],
        future_c: state.future[2]
    };

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/survey_responses`,
            {
                method: 'POST',

                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },

                body: JSON.stringify(responseData)
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        localStorage.setItem(SUBMITTED_KEY, 'true');

        button.textContent = 'Response submitted';

        document.getElementById('success').style.display = 'block';

    } catch (error) {

        console.error(error);

        button.disabled = false;
        button.textContent = 'Submit response';

        alert(
            'Your response could not be submitted. Please try again.'
        );
    }
});
</script>
